name: Publish v0.56 preview
on:
  push:
    branches: [main]
    paths: [".github/workflows/publish-v056.yml"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.56.0 release-staging/FlymeIsland_v0.56_OpenSourcePreview-debug.apk --target "$GITHUB_SHA" --title "Flyme Island v0.56 预览版" --prerelease --notes-file release-staging/notes.md
