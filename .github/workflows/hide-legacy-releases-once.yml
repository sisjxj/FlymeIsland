name: Hide legacy preview releases (one-time)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hide-legacy-releases-once.yml
permissions:
  contents: write
jobs:
  hide:
    if: github.repository == 'sisjxj/FlymeIsland'
    runs-on: ubuntu-latest
    steps:
      - name: Mark v0.56.0 and v0.61.0 as drafts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Draft releases are no longer resolvable via the public tag endpoint.
          # Check by immutable release ID so the operation is idempotent.
          for pair in v0.56.0:429230541 v0.61.0:429259099; do
            version="${pair%%:*}"
            release_id="${pair##*:}"
            draft="$(gh api "repos/$GH_REPO/releases/$release_id" --jq '.draft')"
            if [ "$draft" != "true" ]; then
              echo "Converting $version to draft..."
              gh release edit "$version" --draft
            fi
            gh api "repos/$GH_REPO/releases/$release_id" --jq '{tag_name,draft,prerelease}'
            test "$(gh api "repos/$GH_REPO/releases/$release_id" --jq '.draft')" = "true"
          done
          echo "Confirm v0.62.0 remains public:"
          gh api "repos/$GH_REPO/releases/tags/v0.62.0" --jq '{tag_name,draft,prerelease}'
